services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: masari
      POSTGRES_PASSWORD: masari
      POSTGRES_DB: masari
    ports:
      - "5432:5432"
    volumes:
      - masari_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - masari_redis_data:/data

volumes:
  masari_pg_data:
  masari_redis_data:
